<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wuré, the Senegalese seed-sowing board game. Play against the computer or with a friend.">
<meta name="theme-color" content="#141d3a">
<meta name="application-name" content="Wuré">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wuré">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="telemetry.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Wuré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone screen. Indigo dyed-cloth ground, a carved wooden board in the middle,
     each player's granary strip above and below it. Gold marks whose turn it is. */
  --cloth:#141d3a;
  --cloth-2:#1d2a52;
  --wood:#b0703d;
  --wood-dark:#6b3d1e;
  --pit:#3d2110;
  --seed:#cfd3c4;
  --seed-shade:#8d927f;
  --gold:#f3c333;
  --ink:#f4ecdb;
  --muted:#a8b0cc;
  --danger:#ff8f6b;
  --display:"Syne","Trebuchet MS",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{
  background:
    linear-gradient(170deg,var(--cloth-2),var(--cloth) 55%);
  background-color:var(--cloth);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
.app{
  min-height:100%;
  max-width:620px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
  gap:12px;
}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mark{
  font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.14em;margin:0;line-height:1;
}
.mark span{color:var(--gold)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.tool{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;
}
.tool:active{background:rgba(255,255,255,.16)}
.tool[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Player strips */
.player{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:14px;
  background:rgba(255,255,255,.05);
  border:1px solid transparent;
  transition:border-color .25s, background .25s;
}
.player.active{border-color:var(--gold);background:rgba(243,195,51,.1)}
.player .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);flex:none}
.player.active .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(243,195,51,.22)}
.player .who{flex:1;min-width:0}
.player .name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.player .sub{font-size:12px;color:var(--muted)}
.granary{text-align:right;flex:none}
.granary .num{font-family:var(--body);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.granary .num small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted)}
.granary .bar{width:96px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.granary .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25);color:var(--gold)}}

/* Board */
.board{
  position:relative;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.07) 0 3px, transparent 3px 11px),
    linear-gradient(180deg,#c07d47,var(--wood) 40%,#96592c);
  border-radius:26px;
  padding:clamp(18px,5vw,28px) clamp(10px,3vw,18px);
  box-shadow:0 2px 0 #d39a66 inset, 0 -6px 0 var(--wood-dark) inset, 0 18px 30px rgba(0,0,0,.45);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  column-gap:clamp(5px,1.6vw,10px);
  row-gap:clamp(26px,7vw,38px);
}
.board::after{ /* carved line between the two camps */
  content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;
  background:rgba(60,30,10,.45);box-shadow:0 1px 0 rgba(255,220,180,.25);
}
.pit{
  position:relative;aspect-ratio:1;border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 50% 38%, #2a1508, var(--pit) 70%);
  box-shadow:0 3px 6px rgba(0,0,0,.6) inset, 0 1px 0 rgba(255,225,190,.35);
  transition:box-shadow .2s, transform .12s;
}
.pit.legal{box-shadow:0 3px 6px rgba(0,0,0,.6) inset, 0 0 0 3px var(--gold)}
.pit.legal:active{transform:scale(.94)}
.pit.from{box-shadow:0 3px 6px rgba(0,0,0,.6) inset, 0 0 0 3px rgba(255,255,255,.55)}
.pit.drop{animation:drop .22s}
@keyframes drop{50%{transform:scale(1.09)}}
.pit.take{animation:take .5s 2;box-shadow:0 3px 6px rgba(0,0,0,.6) inset, 0 0 0 4px var(--danger)}
@keyframes take{50%{background:#7a2d14}}
.seed{
  position:absolute;width:19%;height:19%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%, #fff, var(--seed) 45%, var(--seed-shade));
  box-shadow:0 1px 2px rgba(0,0,0,.6);
  pointer-events:none;
}
.count{
  position:absolute;left:50%;transform:translateX(-50%);
  min-width:24px;padding:1px 6px;border-radius:999px;
  background:var(--cloth);color:var(--ink);
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;
  pointer-events:none;
}
.pit.top .count{top:-17px}
.pit.bottom .count{bottom:-17px}
.pit.zero .count{opacity:.45}

/* Status */
.status{
  min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  text-align:center;font-weight:600;text-wrap:balance;
}
.status .hand{
  background:var(--gold);color:#221a05;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;
}
.cta{
  background:var(--gold);color:#221a05;border:0;border-radius:999px;padding:10px 20px;font-weight:700;
}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:#0b1024;border:1px solid rgba(255,255,255,.18);color:var(--ink);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,420px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:5;
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Sponsors: always on screen under the board, display only */
.sponsors{display:flex;flex-direction:column;gap:6px}
.sponsors .lab{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.sponsors .logos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sponsors .tile{
  background:#fff;border-radius:12px;height:54px;padding:7px 8px;
  display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;
}
.sponsors img{max-width:100%;max-height:100%;object-fit:contain;display:block;min-width:0}
.sponsors .tile b{color:#2c4a2e;font-size:12px;line-height:1.05;font-weight:700}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--muted);padding-top:6px}

/* Dialogs */
dialog{
  border:1px solid rgba(255,255,255,.16);border-radius:20px;background:#17213f;color:var(--ink);
  padding:22px;width:min(92vw,440px);max-height:88vh;overflow:auto;
}
dialog::backdrop{background:rgba(5,8,20,.7)}
dialog h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 14px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text]{
  font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:10px 12px;width:100%;
}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:88px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:10px 8px;font-weight:600;font-size:14px;
}
.seg button[aria-pressed="true"]{background:var(--gold);color:#221a05;border-color:var(--gold)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.rules{padding-left:20px;margin:0 0 16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.rules b{color:var(--gold)}
/* Online play */
.guide{margin:12px 0 0;text-align:center}
.guide a{color:var(--gold);font-weight:700}
.chat{display:flex;flex-direction:column;gap:6px}
.chat[hidden]{display:none}
.chat .msgs{min-height:20px;max-height:92px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:2px}
.chat .msgs div{overflow-wrap:anywhere}
.chat .msgs b{color:var(--gold);font-weight:700}
.chat .emojis{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chat .emojis button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;font-size:22px;line-height:1;padding:6px 10px}
.chat .emojis button:active{background:rgba(255,255,255,.18)}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:9px 12px}
.codebig{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.18em;text-align:center;color:var(--gold);margin:6px 0 4px;-webkit-user-select:text;user-select:text}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.err{font-size:14px;color:var(--danger);margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:10px}
.fld{font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;width:100%}
.cta[disabled],.ghost[disabled]{opacity:.5}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.15)}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:13px}
/* Tablets, portrait: a larger board and bigger touch targets */
@media (min-width:700px){
  .app{max-width:760px;gap:16px}
  .mark{font-size:36px}
  .tool{padding:9px 16px;font-size:15px}
  .player .name{font-size:20px}
  .granary .num{font-size:36px}
  .count{font-size:15px;min-width:28px}
  .status{font-size:18px}
  .sponsors .tile{height:70px}
}
/* Tablets and phones turned sideways: board on the left, game info on the right */
@media (min-width:820px) and (orientation:landscape){
  .app{max-width:1100px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:28px;row-gap:14px;align-content:start}
  header,footer{grid-column:1 / -1}
  .board{grid-column:1;grid-row:2 / span 4;align-self:start}
  #p1,#p0,.status,.chat,.sponsors{grid-column:2}
}
@media (max-height:520px) and (orientation:landscape){
  .app{max-width:none;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);column-gap:16px;row-gap:8px;align-content:start}
  header,footer{grid-column:1 / -1}
  .mark{font-size:22px}
  .board{grid-column:1;grid-row:2 / span 4;align-self:start;padding:14px 10px;row-gap:22px}
  #p1,#p0,.status,.chat,.sponsors{grid-column:2}
  .player{padding:6px 12px}
  .sponsors .tile{height:36px}
  .sponsors{gap:4px}
  .sponsors .lbl,.sponsors>:first-child:not(.tile){font-size:10px}
  .status{font-size:15px;line-height:1.25;min-height:0}
  .chat{gap:4px}
  .chat .msgs{max-height:26px;font-size:13px}
  .app{padding-top:8px;padding-bottom:8px}
  .chat .emojis{flex-wrap:nowrap;gap:4px}
  .chat .emojis button{font-size:17px;padding:3px 0;flex:1;border-radius:10px}
  #chatForm input,#chatForm button{padding-top:6px;padding-bottom:6px}
  footer{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="mark">WUR<span>É</span></h1>
    <div class="tools">
      <button class="tool" id="btnOnline" type="button"></button>
      <button class="tool" id="btnNew" type="button"></button>
      <button class="tool" id="btnRules" type="button"></button>
      <button class="tool" id="btnLang" type="button"></button>
      <button class="tool" id="btnSound" type="button" aria-pressed="true"></button>
    </div>
  </header>

  <section class="player" id="p1" aria-live="polite">
    <span class="dot"></span>
    <div class="who"><div class="name"></div><div class="sub"></div></div>
    <div class="granary"><div class="num"><span class="n">0</span> <small>/ 25</small></div><div class="bar"><i></i></div></div>
  </section>

  <div class="board" id="board" role="group" aria-label="Wuré board"></div>

  <section class="player" id="p0" aria-live="polite">
    <span class="dot"></span>
    <div class="who"><div class="name"></div><div class="sub"></div></div>
    <div class="granary"><div class="num"><span class="n">0</span> <small>/ 25</small></div><div class="bar"><i></i></div></div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>

  <section class="chat" id="chat" hidden aria-label="Chat">
    <div class="msgs" id="chatMsgs" aria-live="polite"></div>
    <div class="emojis" id="chatEmojis"></div>
    <form class="chatform" id="chatForm" autocomplete="off">
      <input type="text" id="chatIn" maxlength="40" autocomplete="off" autocapitalize="sentences">
      <button class="tool" type="submit" id="chatSend"></button>
    </form>
  </section>

  <section class="sponsors" aria-labelledby="spLab">
    <div class="lab" id="spLab"></div>
    <div class="logos">
      <div class="tile"><img src="sponsors/planet-auto-hub.png" alt="Planet Auto Hub"></div>
      <div class="tile"><img src="sponsors/nioro-farms.png" alt=""><b>Nioro<br>Farms</b></div>
      <div class="tile"><img src="sponsors/jollof-ventures.png" alt="Jollof Ventures"></div>
    </div>
  </section>

  <footer>© 2026 Nioro Resources LLC</footer>
</div>

<div class="toast" id="toast" role="status"></div>

<dialog id="dlgNew">
  <h2 id="newTitle"></h2>
  <div class="field">
    <span class="lab" id="labMode"></span>
    <div class="seg" id="segMode">
      <button type="button" data-v="cpu"></button>
      <button type="button" data-v="two"></button>
    </div>
  </div>
  <div class="field">
    <label for="inName0" id="labName0"></label>
    <input type="text" id="inName0" maxlength="16" autocomplete="off">
  </div>
  <div class="field" id="fieldName1">
    <label for="inName1" id="labName1"></label>
    <input type="text" id="inName1" maxlength="16" autocomplete="off">
  </div>
  <div class="field" id="fieldLevel">
    <span class="lab" id="labLevel"></span>
    <div class="seg" id="segLevel">
      <button type="button" data-v="easy"></button>
      <button type="button" data-v="medium"></button>
      <button type="button" data-v="hard"></button>
    </div>
  </div>
  <div class="field">
    <span class="lab" id="labFirst"></span>
    <div class="seg" id="segFirst">
      <button type="button" data-v="0"></button>
      <button type="button" data-v="1"></button>
    </div>
  </div>
  <div class="row">
    <button type="button" class="ghost" id="newCancel"></button>
    <button type="button" class="cta" id="newStart"></button>
  </div>
</dialog>

<dialog id="dlgOnline">
  <h2 id="onTitle"></h2>
  <div id="onBody"></div>
  <div class="row"><button type="button" class="ghost" id="onClose"></button></div>
</dialog>

<dialog id="dlgRules">
  <h2 id="rulesTitle"></h2>
  <ol class="rules" id="rulesList"></ol>
  <p class="guide" id="guideRow" hidden><a id="guideLink"></a></p>
  <div class="row"><button type="button" class="cta" id="rulesClose"></button></div>
</dialog>

<script>

  board:[4,4,4,4,4,4,4,4,4,4,4,4], score:[0,0], turn:0, over:false, endMsg:"",
  mode:"cpu", level:"medium", names:["",""], lang:"en", sound:true, from:-1, first:0, online:null, prevMode:"cpu"

function t(k){return T[S.lang][k];}
function nameOf(p){
  if(S.online){ var on=String(S.online.names[p]||"").trim(); if(on) return on; }
  if(p===1 && S.mode==="cpu") return t("computer");
  var n=(S.names[p]||"").trim();
  return n || (p===0 ? t("player1") : t("player2"));
}

/* ---------- Rules engine ---------- */
function side(i){return i<6?0:1;}
function sideSum(b,p){var s=0;for(var i=p*6;i<p*6+6;i++)s+=b[i];return s;}
var QUIET_LIMIT=80; /* moves in a row without a capture before the game is counted */
function isCapture(n){ return n===2||n===4||n===6; }
function simulate(b,p,i){
  var nb=b.slice(), n=nb[i], j=i, steps=[];
  nb[i]=0;
  while(n>0){ j=(j+1)%12; if(j===i) continue; nb[j]++; n--; steps.push(j); }
  var cap=[], captured=0;
  if(isCapture(nb[j])){ cap=[j]; captured=nb[j]; nb[j]=0; }
  return {board:nb, captured:captured, steps:steps, cap:cap, slam:false};
}
function legalMoves(b,p){
  var out=[];
  for(var i=p*6;i<p*6+6;i++){ if(b[i]>0) out.push(i); }
  return out;
}
/* Who plays next: the other player, unless their row is empty (they miss a turn). -1 = nobody can play. */
function nextTurn(b,p){
  if(sideSum(b,1-p)>0) return 1-p;
  if(sideSum(b,p)>0) return p;
  return -1;
}

/* ---------- Computer player ---------- */
function search(b,sc,p,depth,alpha,beta,me){
  if(sc[0]>=25||sc[1]>=25) return (sc[me]-sc[1-me])*10 + (sc[me]>=25?500:-500);
  var moves=legalMoves(b,p);
  if(!moves.length){
    var a=sc[me]+sideSum(b,me), o=sc[1-me]+sideSum(b,1-me);
    return (a-o)*10 + (a>o?500:(a<o?-500:0));
  }
  if(depth===0) return (sc[me]-sc[1-me])*10;
  var best = p===me ? -1e9 : 1e9;
  for(var m=0;m<moves.length;m++){
    var r=simulate(b,p,moves[m]);
    var ns=[sc[0],sc[1]]; ns[p]+=r.captured;
    var np=nextTurn(r.board,p);
    var v = np<0 ? (ns[me]-ns[1-me])*10 : search(r.board,ns,np,depth-1,alpha,beta,me);
    if(p===me){ if(v>best)best=v; if(best>alpha)alpha=best; }
    else { if(v<best)best=v; if(best<beta)beta=best; }
    if(alpha>=beta) break;
  }
  return best;
}
function cpuChoose(){
  var moves=legalMoves(S.board,1);
  if(S.level==="easy" && Math.random()<0.4) return moves[Math.floor(Math.random()*moves.length)];
  var depth = S.level==="hard" ? 10 : (S.level==="medium" ? 4 : 2);
  var best=-1e9, picks=[];
  for(var m=0;m<moves.length;m++){
    var r=simulate(S.board,1,moves[m]);
    var ns=[S.score[0],S.score[1]+r.captured];
    var np=nextTurn(r.board,1);
    var v = np<0 ? (ns[1]-ns[0])*10 : search(r.board,ns,np,depth-1,-1e9,1e9,1);
    if(v>best){best=v;picks=[moves[m]];} else if(v===best) picks.push(moves[m]);
  }
  return picks[Math.floor(Math.random()*picks.length)];
}

/* ---------- Sound ---------- */
var ac=null;
function audio(){
  if(!S.sound) return null;
  try{
    if(!ac){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ac=new AC(); }
    if(ac.state==="suspended") ac.resume();
    return ac;
  }catch(e){ return null; }
}
function tone(freq,end,dur,vol,type,delay){
  var a=audio(); if(!a) return;
  try{
    var t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||"triangle";
    o.frequency.setValueAtTime(freq,t0);
    o.frequency.exponentialRampToValueAtTime(end,t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sndDrop(){ tone(480+Math.random()*220,130,0.08,0.3,"triangle"); }
function sndPick(){ tone(220,330,0.1,0.2,"sine"); }
function sndTake(){ tone(520,780,0.14,0.25,"square"); tone(780,1040,0.18,0.22,"square",0.13); }
function sndWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f,f,0.22,0.25,"triangle",i*0.14); }); }
function sndNo(){ tone(180,120,0.15,0.2,"sawtooth"); }

function drawPit(i){
  var n=S.board[i], el=pits[i], box=el.firstChild, show=Math.min(n,18), html="";
  for(var k=0;k<show;k++){
    var r = show===1 ? 0 : 31*Math.sqrt((k+0.6)/show);
    var ang = k*2.4 + i*1.3;
    html+='<i class="seed" style="left:'+(50+r*Math.cos(ang)).toFixed(1)+'%;top:'+(50+r*Math.sin(ang)).toFixed(1)+'%"></i>';
  }
  box.innerHTML=html;
  el.lastChild.textContent=n;
  el.classList.toggle("zero",n===0);
  el.setAttribute("aria-label",(side(i)===0?nameOf(0):nameOf(1))+", "+n);
}
function bottomSeat(){ return S.online ? S.online.seat : 0; }
function humanTurn(){ return !S.over && !busy && !(S.mode==="cpu" && S.turn===1) && !(S.online && S.turn!==S.online.seat); }
var shownBs=-1;
function layoutBoard(){
  var bs=bottomSeat(); if(bs===shownBs) return; shownBs=bs;
  var ord = bs===0 ? [11,10,9,8,7,6,0,1,2,3,4,5] : [5,4,3,2,1,0,6,7,8,9,10,11];
  ord.forEach(function(i){ boardEl.appendChild(pits[i]); });
}
function render(){
  layoutBoard();
  var bs=bottomSeat();
  var legal = humanTurn() ? legalMoves(S.board,S.turn) : [];
  for(var i=0;i<12;i++){
    drawPit(i);
    pits[i].classList.toggle("bottom",side(i)===bs);
    pits[i].classList.toggle("top",side(i)!==bs);
    pits[i].classList.toggle("legal",legal.indexOf(i)>=0);
    pits[i].classList.toggle("from",i===S.from);
  }
  for(var k=0;k<2;k++){
    var p = k===0 ? bs : 1-bs;
    var el=document.getElementById("p"+k);
    el.classList.toggle("active",!S.over && S.turn===p);
    el.querySelector(".name").textContent=nameOf(p);
    el.querySelector(".sub").textContent= k===0 ? t("yourRowBottom") : t("yourRowTop");
    el.querySelector(".n").textContent=S.score[p];

}

    e.addEventListener("click",function(){ finishByCount(t("endCountDone")); render(); }); st.appendChild(e);

function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

/* ---------- Game flow ---------- */
function onPit(i){
  if(S.over || busy) return;
  if(S.mode==="cpu" && S.turn===1) return;
  audio();
  if(S.online && S.turn!==S.online.seat){ toast(t("notYourTurn")); sndNo(); return; }
  if(side(i)!==S.turn){ toast(t("notYours")); sndNo(); return; }
  if(S.board[i]===0){ toast(t("emptyPit")); sndNo(); return; }
  if(S.online && window.WureOnline && !window.WureOnline.sendMove(i)) return;
  playMove(i);
}
async function playMove(i){
  var id=gameId, p=S.turn, sim=simulate(S.board,p,i);
  busy=true;
  var hand=S.board[i]; S.board[i]=0; S.from=i;
  render(); renderStatus(hand); sndPick();
  var speed = sim.steps.length>12 ? 110 : 190;
  for(var s=0;s<sim.steps.length;s++){
    await wait(speed); if(id!==gameId) return;
    var j=sim.steps[s]; S.board[j]++; hand--;
    drawPit(j);
    pits[j].classList.remove("drop"); void pits[j].offsetWidth; pits[j].classList.add("drop");
    renderStatus(hand); sndDrop();
  }
  if(sim.cap.length){
    await wait(280); if(id!==gameId) return;
    sim.cap.forEach(function(k){ pits[k].classList.add("take"); });
    sndTake();
    await wait(900); if(id!==gameId) return;
    sim.cap.forEach(function(k){ pits[k].classList.remove("take"); });
    S.score[p]+=sim.captured; bump(p);
    toast(t("took")(nameOf(p),sim.captured));
  }
  S.board=sim.board;
  S.quiet = sim.captured ? 0 : (S.quiet||0)+1;
  var nt=nextTurn(S.board,p);
  S.turn = nt<0 ? 1-p : nt;
  busy=false;
  checkEnd();
  if(!S.over && nt===p) toast(t("pass")(nameOf(1-p)));
  render();
  if(S.online && window.WureOnline) window.WureOnline.pump();
  if(!S.over) scheduleCpu();
}
function setResult(prefix){
  S.over=true;
  var a=S.score[0], b=S.score[1], msg;
  if(a===b) msg=t("draw").replace("24",String(a));
  else if(a>b) msg=t("wins")(nameOf(0),a,b);
  else msg=t("wins")(nameOf(1),b,a);
  S.endMsg=(prefix?prefix+" ":"")+msg;
  sndWin();
  if(window.WureStats) window.WureStats.end(S);
}
function finishByCount(prefix){
  S.score[0]+=sideSum(S.board,0); S.score[1]+=sideSum(S.board,1);
  for(var i=0;i<12;i++) S.board[i]=0;
  S.from=-1;
  setResult(prefix);
}
function checkEnd(){
  if(S.score[0]>=25 || S.score[1]>=25 || (S.score[0]===24 && S.score[1]===24)){ setResult(""); return; }
  if(!legalMoves(S.board,S.turn).length){ finishByCount(t("noMoves")); return; }
  if((S.quiet||0)>=QUIET_LIMIT) finishByCount(t("cycle"));
}
function scheduleCpu(){
  clearTimeout(cpuTimer);
  if(S.over || S.mode!=="cpu" || S.turn!==1) return;
  var id=gameId;
  cpuTimer=setTimeout(function(){
    if(id!==gameId || S.over || busy) return;
    playMove(cpuChoose());
  },750);
}
function newGame(){
  gameId++; busy=false; clearTimeout(cpuTimer);
  S.board=[4,4,4,4,4,4,4,4,4,4,4,4]; S.score=[0,0]; S.turn=S.first; S.over=false; S.endMsg=""; S.from=-1; S.quiet=0;
  if(window.WureStats) window.WureStats.start(S);
  render(); scheduleCpu();
}

window.WureGame={
  S:S, t:t, toast:toast, audio:audio, side:side, legalMoves:legalMoves,
  isBusy:function(){ return busy; },
  remoteMove:function(i){
    if(S.over||busy||!S.online) return false;
    if(side(i)!==S.turn || S.board[i]<=0 || legalMoves(S.board,S.turn).indexOf(i)<0) return false;
    playMove(i); return true;
  },
  silentMove:function(i){
    if(S.over||S.board[i]<=0) return false;
    var p=S.turn, sim=simulate(S.board,p,i);
    S.board=sim.board; S.score[p]+=sim.captured; S.from=-1;
    S.quiet = sim.captured ? 0 : (S.quiet||0)+1;
    var nt=nextTurn(S.board,p); S.turn = nt<0 ? 1-p : nt;
    checkEnd(); return true;
  },
  startOnline:function(info){
    if(!S.online) S.prevMode=S.mode;
    S.online={seat:info.seat,names:[info.names[0]||"",info.names[1]||""]}; S.mode="online";
    gameId++; busy=false; clearTimeout(cpuTimer);
    S.board=[4,4,4,4,4,4,4,4,4,4,4,4]; S.score=[0,0]; S.turn=info.first; S.over=false; S.endMsg=""; S.from=-1; S.quiet=0;
    if(window.WureStats) window.WureStats.start(S);
    render();
  },
  setNames:function(n){ if(S.online){ S.online.names=[n[0]||"",n[1]||""]; render(); } },
  stopOnline:function(){
    if(!S.online) return;
    S.online=null; S.mode=S.prevMode||"cpu"; shownBs=-1; newGame();
  },
  endWith:function(msg){ if(S.over) return; S.over=true; S.endMsg=msg; busy=false; render(); sndWin(); if(window.WureStats) window.WureStats.end(S,"left"); },
  render:function(){ render(); },
  lang:function(){ return S.lang; },
  name:function(){ return (S.names[0]||"").trim(); }
};

/* ---------- Saved settings (names, language, sound) ---------- */
var KEY="wure.settings.v1";
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify({names:S.names,lang:S.lang,sound:S.sound,mode:S.mode,level:S.level,first:S.first})); }catch(e){}
}
function load(){
  var d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  if(d && typeof d==="object"){
    if(Array.isArray(d.names)) S.names=[String(d.names[0]||"").slice(0,16),String(d.names[1]||"").slice(0,16)];
    if(d.lang==="en"||d.lang==="fr"||d.lang==="it") S.lang=d.lang;
    if(typeof d.sound==="boolean") S.sound=d.sound;
    if(d.mode==="cpu"||d.mode==="two") S.mode=d.mode;
    if(d.level==="easy"||d.level==="medium"||d.level==="hard") S.level=d.level;
    if(d.first===0||d.first===1) S.first=d.first;
  } else {
    var nl=(navigator.language||"en").slice(0,2).toLowerCase();
    S.lang = nl==="fr" ? "fr" : (nl==="it" ? "it" : "en");
    S.names=["",""];
  }
}

/* ---------- Boot ---------- */
load();
S.turn=S.first;
renderText(); render(); scheduleCpu();
if(window.WureStats){ window.WureStats.start(S); window.WureStats.boot(); }
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
<script src="online.js"></script>
</body>
